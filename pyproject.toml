[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spike"
version = "0.1.0"
description = "Extract calibrated waveform time series and metadata from vector ECG report PDFs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["ecg", "ekg", "pdf", "digitization", "signal", "electrocardiogram", "waveform"]
authors = [{ name = "spike contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Core runtime: only what the extractor itself needs.
dependencies = [
    "numpy>=1.24",
    "pikepdf>=8.0",
]

[project.optional-dependencies]
# Parse the embedded text layer (patient / measurements / diagnosis).
meta = ["pypdfium2>=4.0"]
# ECGResult.plot() sanity figures.
plot = ["matplotlib>=3.6"]
# Everything, plus the test/dev toolchain.
all = ["pypdfium2>=4.0", "matplotlib>=3.6"]
dev = ["pypdfium2>=4.0", "matplotlib>=3.6", "pytest>=8.0"]

[project.scripts]
spike = "spike.ecg_pdf:main"

[project.urls]
Homepage = "https://example.com/spike"
Source = "https://example.com/spike"

[tool.hatch.build.targets.wheel]
packages = ["src/spike"]

[tool.hatch.build.targets.sdist]
include = ["src/spike", "README.md", "pyproject.toml"]
